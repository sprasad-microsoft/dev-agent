name: Dependency monitoring

on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, ".github/workflows/dependency-monitoring.yml"]
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install checksum-verified OSV-Scanner
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/osv-scanner"
      - name: Scan tooling dependencies
        shell: bash
        run: node scripts/monitor-dependencies.mjs --scanner "$RUNNER_TEMP/osv-scanner" --repository-only
      - name: Persist complete scan findings in GitHub code scanning
        if: ${{ always() && hashFiles('.dev-agent/security-results/dependencies.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: .dev-agent/security-results/dependencies.sarif
          category: dev-agent-dependencies
      - name: Publish reports only when explicitly enabled
        if: ${{ always() && vars.DEV_AGENT_UPLOAD_SECURITY_REPORTS == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: |
            .dev-agent/security-results/
            .dev-agent/vulnerabilities.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
